<style>
* {
box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial;
}

.header {
    text-align: center;
    padding: 32px;
}

.row {
    display: -ms-flexbox; 
    display: flex;
    -ms-flex-wrap: wrap;
    flex-wrap: wrap;
    padding: 0 4px;
}

/*make 4 equal collumns */
.column {
    -ms-flex: 25%;
    flex: 25%;
    max-width: 25%;
    padding: 0 4px;
}

.column img {
    margin-top: 8px;
    vertical-align: middle;
    width: 100%;
}
/*responsive layout (adjusts the amount of columns*/
@media screen and (max-width: 800px){
    .column{
        -ms-flex: 50%;
        flex: 50%;
        max-width: 50%;
    }
    
} 
    /*makes the columns stack if a small device*/
@media screen and (max-width: 600px) {
    .column {
        -ms-flex: 100%;
        flex: 100%;
        max-width: 100%;
    }
    
}
</style>
